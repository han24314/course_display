<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面已迁移 - 课程表</title>
<link rel="canonical" href="./">
<meta http-equiv="refresh" content="0; url=./">
<script>
(function () {
  var target = './' + window.location.search + window.location.hash;
  window.location.replace(target);
})();
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #f4f6fa;
    color: #1f2733;
  }
  .box { text-align: center; padding: 32px; }
  .box a { color: #2f6fed; font-weight: 600; text-decoration: none; }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 16px;
    border: 2px solid #d8e0ee; border-top-color: #2f6fed;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 0 0 10px; font-size: 15px; color: #6b7688; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>页面已迁移，正在跳转到课程表首页…</p>
    <p>如果没有自动跳转，请点击 <a href="./">进入课程表</a></p>
  </div>
</body>
</html>
